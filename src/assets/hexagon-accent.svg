<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 714 432"
  fill="none"
>
  <defs>

    <path
      id="hex"
      d="M21 0H63L84 36L63 72H21L0 36Z"
    />

<g id="honeycomb">

  <!-- column 1 -->
  <use href="#hex" x="0" y="0"/>
  <use href="#hex" x="0" y="72"/>
  <use href="#hex" x="0" y="144"/>
  <use href="#hex" x="0" y="216"/>
  <use href="#hex" x="0" y="288"/>
  <use href="#hex" x="0" y="360"/>

  <!-- column 2 -->
  <use href="#hex" x="63" y="36"/>
  <use href="#hex" x="63" y="108"/>
  <use href="#hex" x="63" y="180"/>
  <use href="#hex" x="63" y="252"/>
  <use href="#hex" x="63" y="324"/>

  <!-- column 3 -->
  <use href="#hex" x="126" y="0"/>
  <use href="#hex" x="126" y="72"/>
  <use href="#hex" x="126" y="144"/>
  <use href="#hex" x="126" y="216"/>
  <use href="#hex" x="126" y="288"/>
  <use href="#hex" x="126" y="360"/>

  <!-- column 4 -->
  <use href="#hex" x="189" y="36"/>
  <use href="#hex" x="189" y="108"/>
  <use href="#hex" x="189" y="180"/>
  <use href="#hex" x="189" y="252"/>
  <use href="#hex" x="189" y="324"/>

  <!-- column 5 -->
  <use href="#hex" x="252" y="0"/>
  <use href="#hex" x="252" y="72"/>
  <use href="#hex" x="252" y="144"/>
  <use href="#hex" x="252" y="216"/>
  <use href="#hex" x="252" y="288"/>
  <use href="#hex" x="252" y="360"/>

  <!-- column 6 -->
  <use href="#hex" x="315" y="36"/>
  <use href="#hex" x="315" y="108"/>
  <use href="#hex" x="315" y="180"/>
  <use href="#hex" x="315" y="252"/>
  <use href="#hex" x="315" y="324"/>

  <!-- column 7 -->
  <use href="#hex" x="378" y="0"/>
  <use href="#hex" x="378" y="72"/>
  <use href="#hex" x="378" y="144"/>
  <use href="#hex" x="378" y="216"/>
  <use href="#hex" x="378" y="288"/>
  <use href="#hex" x="378" y="360"/>

  <!-- column 8 -->
  <use href="#hex" x="441" y="36"/>
  <use href="#hex" x="441" y="108"/>
  <use href="#hex" x="441" y="180"/>
  <use href="#hex" x="441" y="252"/>
  <use href="#hex" x="441" y="324"/>

  <!-- column 9 -->
  <use href="#hex" x="504" y="0"/>
  <use href="#hex" x="504" y="72"/>
  <use href="#hex" x="504" y="144"/>
  <use href="#hex" x="504" y="216"/>
  <use href="#hex" x="504" y="288"/>
  <use href="#hex" x="504" y="360"/>

  <!-- new column 10 -->
  <use href="#hex" x="567" y="36"/>
  <use href="#hex" x="567" y="108"/>
  <use href="#hex" x="567" y="180"/>
  <use href="#hex" x="567" y="252"/>
  <use href="#hex" x="567" y="324"/>

  <!-- new column 11 -->
  <use href="#hex" x="630" y="0"/>
  <use href="#hex" x="630" y="72"/>
  <use href="#hex" x="630" y="144"/>
  <use href="#hex" x="630" y="216"/>
  <use href="#hex" x="630" y="288"/>

</g>
    <linearGradient
      id="shine-gradient"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop offset="0%" stop-color="black"/>
      <stop offset="25%" stop-color="black"/>

      <stop
        offset="48%"
        stop-color="white"
        stop-opacity="0.22"
      />

      <stop
        offset="50%"
        stop-color="white"
        stop-opacity="0.9"
      />

      <stop
        offset="52%"
        stop-color="white"
        stop-opacity="0.22"
      />

      <stop offset="75%" stop-color="black"/>
      <stop offset="100%" stop-color="black"/>
    </linearGradient>

    <mask
      id="shine-mask"
      maskUnits="userSpaceOnUse"
      x="-500"
      y="-500"
      width="1600"
      height="1400"
    >
      <g class="shine-motion">
        <rect
          x="-100"
          y="-350"
          width="190"
          height="1100"
          rx="95"
          fill="url(#shine-gradient)"
          transform="rotate(-35)"
        />
      </g>
    </mask>

    <filter
      id="shine-glow"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feGaussianBlur
        stdDeviation="1.3"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <use
    href="#honeycomb"
    fill="#0d0d0e"
    fill-opacity="0.38"
    stroke="#ff5a36"
    stroke-opacity="0.22"
    stroke-width="1.2"
  />


  <g
    class="shine-layer"
    mask="url(#shine-mask)"
    filter="url(#shine-glow)"
  >
    <use
      href="#honeycomb"
      fill="none"
      stroke="#ff7657"
      stroke-opacity="0.78"
      stroke-width="1.7"
    />
  </g>


  <style>

    .shine-motion {
      transform-box: view-box;
      transform-origin: center;

      animation:
        shine-sweep
        12s
        cubic-bezier(0.22, 0.61, 0.36, 1)
        infinite;
    }

    .shine-layer {
      opacity: 0;

      animation:
        shine-opacity
        12s
        ease
        infinite;
    }


    @keyframes shine-sweep {

      0%,
      42% {
        transform: translate(-420px, -180px);
      }

      48% {
        transform: translate(-300px, -120px);
      }

      86% {
        transform: translate(780px, 320px);
      }

      100% {
        transform: translate(900px, 400px);
      }
    }


    @keyframes shine-opacity {

      0%,
      42% {
        opacity: 0;
      }

      48% {
        opacity: 0.18;
      }

      62% {
        opacity: 0.38;
      }

      78% {
        opacity: 0.28;
      }

      90%,
      100% {
        opacity: 0;
      }
    }


    @media (prefers-reduced-motion: reduce) {

      .shine-motion,
      .shine-layer {
        animation: none;
      }

      .shine-layer {
        opacity: 0;
      }
    }

  </style>

</svg>